<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>STUDENT - ĐIỀN ĐÁP ÁN</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --blue: #1e88e5;
            --peach: #ffb7b2;
        }
        body { background: #1a1a1a; color: white; font-family: 'Segoe UI', sans-serif; padding: 20px; margin: 0; }
        h2 { text-align: center; color: var(--peach); text-transform: uppercase; letter-spacing: 2px; }
        
        .container { overflow-x: auto; background: #2d2d2d; padding: 15px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 10px 5px; text-align: center; border-bottom: 1px solid #444; }
        
        th { background-color: #111; color: var(--peach); font-size: 0.8rem; position: sticky; top: 0; }
        .col-name { width: 180px; text-align: left; padding-left: 15px; }
        .col-score { width: 80px; color: #00ff00; font-size: 1.2rem; }

        input { 
            width: 55px; height: 30px; text-align: center; text-transform: uppercase; 
            border: 1px solid #555; border-radius: 4px; background: #000; color: #fff;
            outline: none; transition: 0.3s;
        }
        
        /* Khi câu hỏi đã được Admin chốt đáp án */
        input:disabled {
            background: #222;
            cursor: not-allowed;
            opacity: 0.8;
        }

        .correct { border: 2px solid #00ff00 !important; color: #00ff00 !important; font-weight: bold; background: rgba(0,255,0,0.1) !important; }
        .wrong { border: 2px solid #ff4444 !important; color: #ff4444 !important; background: rgba(255,0,0,0.1) !important; }

        .name-text { font-weight: bold; color: #fff; }
        .status-msg { text-align: center; margin-bottom: 10px; font-size: 0.9rem; color: #00ff00; }
    </style>
</head>
<body>

    <h2>BẢNG ĐÁP ÁN NGHE PLAYTOEIC</h2>
    <div class="status-msg">Nhiệm vụ Hệ thống: Điền đáp án đúng (Ô sẽ tự khóa khi admin công bố đáp án)</div>
    
    <div class="container">
        <table id="answerTable">
            <thead>
                <tr id="headerRow">
                    <th class="col-name">Họ và Tên</th>
                    <th class="col-score">Điểm</th>
                </tr>
            </thead>
            <tbody id="studentBody"></tbody>
        </table>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAhodfr-XjA3wzeeJTEdFRtn0KFBNJ4mLw",
        authDomain: "nghe-chon-dap-an.firebaseapp.com",
        databaseURL: "https://nghe-chon-dap-an-default-rtdb.firebaseio.com",
        projectId: "nghe-chon-dap-an",
        storageBucket: "nghe-chon-dap-an.firebasestorage.app",
        messagingSenderId: "251465237282",
        appId: "1:251465237282:web:de82395e7513a0774bdb7b",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const numQ = 15;

    function createHeader() {
        const headerRow = document.getElementById('headerRow');
        const scoreHeader = headerRow.lastElementChild;
        for (let i = 1; i <= numQ; i++) {
            const th = document.createElement('th');
            th.innerText = i;
            headerRow.insertBefore(th, scoreHeader);
        }
    }

    function sendAns(pId, qIdx, val) {
        // Chuyển Â thành AA và xóa khoảng trắng thừa
        let finalVal = val.toUpperCase().replace(/Â/g, 'AA').trim();
        db.ref(`class_room/answers/${pId}/${qIdx}`).set(finalVal.toLowerCase());
    }

    db.ref('class_room').on('value', snap => {
        const data = snap.val() || {};
        const tbody = document.getElementById('studentBody');
        tbody.innerHTML = '';

        if (!data.players) return;

        for (let id in data.players) {
            const tr = document.createElement('tr');
            let rowHtml = `<td class="col-name"><span class="name-text">${data.players[id].name}</span></td>`;
            
            for (let i = 0; i < numQ; i++) {
                const studentVal = data.answers?.[id]?.[i] || '';
                const correctKey = data.correct_keys?.[i] || ''; // Đáp án từ Admin
                
                // KIỂM TRA: Nếu cột này Admin đã điền đáp án đúng (khác rỗng)
                const isColumnLocked = (correctKey !== "");
                
                let statusClass = '';
                if (isColumnLocked) {
                    statusClass = (studentVal === correctKey) ? 'correct' : 'wrong';
                }
                
                rowHtml += `<td>
                    <input type="text" 
                           class="${statusClass}" 
                           maxlength="3" 
                           value="${studentVal}" 
                           ${isColumnLocked ? 'disabled' : ''} 
                           oninput="sendAns('${id}', ${i}, this.value.toUpperCase().replace('Â', 'AA'))">
                </td>`;
            }

            rowHtml += `<td class="col-score"><strong>${data.players[id].score || 0}</strong></td>`;
            tr.innerHTML = rowHtml;
            tbody.appendChild(tr);
        }
    });

    createHeader();
</script>
</body>
</html>
