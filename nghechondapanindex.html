<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>ĐIỀN ĐÁP ÁN NHÓM - PLAYTOEIC</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --peach: #ffb7b2;
            --dark-peach: #ff8b94;
            --black: #1a1a1a;
            --gray: #2d2d2d;
            --white: #ffffff;
            --bright-green: #00ff00;
            --red: #ff6b6b;
            --blue: #1e88e5;
        }

        body {
            background-color: var(--black);
            color: var(--white);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            color: var(--peach);
            border-bottom: 2px solid var(--peach);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .admin-controls {
            background: var(--gray);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--peach);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--black);
        }

        th, td {
            border: 1px solid #444;
            padding: 10px;
            text-align: center;
        }

        th { background-color: var(--blue); color: white; }
        
        /* Cột tên học sinh */
        .name-cell { background-color: #8b4513; color: white; text-align: left; width: 200px; }
        .score-cell { background-color: var(--blue); width: 50px; }

        input {
            width: 90%;
            background: transparent;
            border: none;
            color: white;
            text-align: center;
            font-size: 1.1rem;
            outline: none;
        }

        .correct { color: var(--bright-green) !important; font-weight: bold; }
        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-check { background: var(--bright-green); color: black; }
        .btn-reset { background: var(--red); color: white; }
    </style>
</head>
<body>

<header>
    <h1>BẢNG ĐIỀN ĐÁP ÁN TRỰC TUYẾN</h1>
</header>

<div class="admin-controls">
    <strong>CHỦ PHÒNG:</strong>
    <button class="btn btn-check" onclick="finalizeAnswers()">CÔNG BỐ ĐÁP ÁN & CHẤM ĐIỂM</button>
    <button class="btn btn-reset" onclick="resetTable()">XÓA HẾT LÀM LẠI</button>
    <span style="font-size: 0.8rem; margin-left: 20px;">* Chỉ chủ phòng nên bấm các nút này.</span>
</div>

<table id="scoreTable">
    <thead>
        <tr>
            <th>Họ và Tên</th>
            <th>Điểm</th>
            <th>Câu 1</th>
            <th>Câu 2</th>
            <th>Câu 3</th>
            <th>Câu 4</th>
        </tr>
    </thead>
    <tbody id="tableBody">
        </tbody>
</table>

<script>
    // 1. CẤU HÌNH FIREBASE (Thay bằng thông tin của bạn)
// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAhodfr-XjA3wzeeJTEdFRtn0KFBNJ4mLw",
  authDomain: "nghe-chon-dap-an.firebaseapp.com",
  databaseURL: "https://nghe-chon-dap-an-default-rtdb.firebaseio.com",
  projectId: "nghe-chon-dap-an",
  storageBucket: "nghe-chon-dap-an.firebasestorage.app",
  messagingSenderId: "251465237282",
  appId: "1:251465237282:web:de82395e7513a0774bdb7b",
  measurementId: "G-3GMBL3Z9XS"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. DỮ LIỆU ĐÁP ÁN ĐÚNG (Bạn sửa ở đây)
    const correctAnswers = ["c", "a", "b", "d"];
    
    // Danh sách học sinh (Có thể thêm bớt tùy ý)
    const students = [
        "Thúy Vy", "Trung Quân", "Thùy Dương", "Minh Hiền", "Trường An"
    ];

    // 3. KHỞI TẠO BẢNG
    function initTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        students.forEach((name, index) => {
            let row = `<tr>
                <td class="name-cell">${name} ${index + 4}</td>
                <td class="score-cell" id="score-${index}">0</td>
                ${correctAnswers.map((_, i) => `
                    <td><input type="text" id="input-${index}-${i}" oninput="sendData(${index}, ${i}, this.value)"></td>
                `).join('')}
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    // 4. GỬI DỮ LIỆU LÊN FIREBASE KHI NGƯỜI DÙNG NHẬP
    function sendData(studentIdx, questionIdx, value) {
        db.ref('class_room/answers/' + studentIdx + '_' + questionIdx).set(value);
    }

    // 5. LẮNG NGHE THAY ĐỔI TỪ FIREBASE (Để mọi người cùng thấy nhau điền)
    db.ref('class_room/answers').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            for (let key in data) {
                const [sIdx, qIdx] = key.split('_');
                const input = document.getElementById(`input-${sIdx}-${qIdx}`);
                if (input && document.activeElement !== input) {
                    input.value = data[key];
                }
            }
        }
    });

    // 6. CHỦ PHÒNG CHỐT ĐÁP ÁN
    function finalizeAnswers() {
        students.forEach((_, sIdx) => {
            let totalCorrect = 0;
            correctAnswers.forEach((ans, qIdx) => {
                const input = document.getElementById(`input-${sIdx}-${qIdx}`);
                if (input.value.trim().toLowerCase() === ans.toLowerCase()) {
                    input.classList.add('correct');
                    totalCorrect++;
                } else {
                    input.value = ""; // Xóa nếu sai
                }
            });
            document.getElementById(`score-${sIdx}`).innerText = totalCorrect;
        });
    }

    function resetTable() {
        if(confirm("Bạn có chắc muốn xóa hết dữ liệu không?")) {
            db.ref('class_room').remove();
            location.reload();
        }
    }

    initTable();
</script>

</body>
</html>
